name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # tombol "Run workflow" manual
  repository_dispatch:      # dipanggil Airtable Automation saat konten berubah
    types: [airtable-update]
  schedule:
    - cron: "0 17 * * *"    # tiap hari 00:00 WIB, agar acara yang lewat otomatis berpindah

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (sync Airtable lalu generate situs)
        env:
          # Jika variable SITE_URL kosong, otomatis pakai URL github.io repo ini
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
